[options]
data_dir = /var/lib/odoo
list_db = True
proxy_mode = True

# Master password untuk operasi database (buat/backup/drop via web).
# GANTI untuk penggunaan serius!
admin_passwd = odoo17-master

# Mode hobby: 1 worker. Naikkan untuk produksi.
workers = 0
max_cron_threads = 1

# Batas memori disesuaikan untuk plan free Render (512MB)
limit_memory_soft = 536870912
limit_memory_hard = 805306368
limit_time_cpu = 60
limit_time_real = 120