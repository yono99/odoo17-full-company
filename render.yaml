# Render Blueprint — Odoo 17 + OCA + modul custom (gratis / hobby)
# Cara pakai: push repo ke GitHub, buka
#   https://dashboard.render.com/blueprint/new?repo=<URL-REPO>
# lalu isi secret env (NEON_HOST/NEON_USER/NEON_PASSWORD) di dashboard.
services:
  - type: web
    name: odoo17-full-company
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      # Isi dari Neon PostgreSQL (sync: false -> diisi manual di dashboard)
      - key: NEON_HOST
        sync: false
      - key: NEON_PORT
        value: "5432"
      - key: NEON_USER
        sync: false
      - key: NEON_PASSWORD
        sync: false
    disk:
      name: odoo-data
      mountPath: /var/lib/odoo
      sizeGB: 1

  # Anti-tidur: ping service tiap 10 menit agar tidak spin-down (plan free)
  - type: cron
    name: odoo17-keepalive
    runtime: python
    plan: free
    region: singapore
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: "python scripts/keepalive.py"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"