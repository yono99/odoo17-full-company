# Anti-tidur untuk service free Render.
# Render free tier menidurkan service setelah ~15 menit tanpa request HTTP.
# Workflow ini melakukan ping ke Odoo setiap 10 menit agar tetap terjaga.
#
# Catatan: GitHub menonaktifkan scheduled workflow setelah 60 hari repo
# tidak ada aktivitas — cukup push commit kecil sesekali untuk menjaganya.
name: Keep-alive Odoo (ping tiap 10 menit)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Odoo
        continue-on-error: true
        run: |
          echo "Ping https://odoo17-full-company.onrender.com/web/login"
          curl -sS -o /dev/null -w "status=%{http_code} waktu=%{time_total}s\n" \
            --max-time 120 \
            https://odoo17-full-company.onrender.com/web/login || \
            echo "Gagal (service mungkin sedang cold start) — coba lagi berikutnya"
